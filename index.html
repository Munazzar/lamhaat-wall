<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lamhaat</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="description" content="A private photo library.">
  <meta name="theme-color" content="#e8e6e1">
  <meta name="color-scheme" content="light dark">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400&family=Amiri:wght@700&display=swap&text=%D9%84%D9%85%D8%AD%D8%A7%D8%AA%D9%80">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <a class="back" href="#/" aria-label="All albums" hidden>
      <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" /></svg><span>Albums</span>
    </a>
    <a class="mark" href="#/" aria-label="Lamhaat, home"><svg class="ap" viewBox="0 0 64 64" aria-hidden="true"><defs><mask id="ap-m"><circle cx="32" cy="32" r="28" fill="#fff" /><g class="iris"><path d="M41 32 6.5 91.75M36.5 39.79-32.5 39.79M27.5 39.79-7-19.96M23 32 57.5-27.75M27.5 24.21 96.5 24.21M36.5 24.21 71 83.96" stroke="#000" stroke-width="3.6" /><path d="M41 32 36.5 39.79H27.5L23 32 27.5 24.21H36.5Z" fill="#000" /></g></mask></defs><circle cx="32" cy="32" r="28" fill="currentColor" mask="url(#ap-m)" /><path class="pupil" d="M38.8 32 35.4 37.89H28.6L25.2 32 28.6 26.11H35.4Z" /></svg><span class="callig" aria-hidden="true"><span class="script" lang="ar" dir="rtl">لمحات</span></span><span class="lat">Lamh<em>aat</em></span></a>
    <span class="bar-title" aria-hidden="true"></span>
    <label class="search" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" /><path d="m13 13 5 5" /></svg>
      <input type="search" placeholder="Search" aria-label="Search photos" autocomplete="off" spellcheck="false">
    </label>
    <button class="theme" type="button" aria-label="Switch to night">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs><clipPath id="sky"><rect width="24" height="17.6" /></clipPath></defs>
        <g clip-path="url(#sky)">
          <g class="sun"><circle cx="12" cy="12" r="3.6" /><path d="M12 4.6v1.6M12 17.8v1.6M4.6 12h1.6M17.8 12h1.6M6.8 6.8l1.1 1.1M16.1 16.1l1.1 1.1M6.8 17.2l1.1-1.1M16.1 7.9l1.1-1.1" /></g>
          <path class="moon" d="M13.6 6.2a5.6 5.6 0 1 0 4.6 8.6 4.4 4.4 0 0 1-4.6-8.6Z" />
        </g>
        <path class="horizon" d="M3.5 17.6h17" />
      </svg>
    </button>
  </header>
  <main id="view"></main>
  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer"></div>
</body>
</html>
